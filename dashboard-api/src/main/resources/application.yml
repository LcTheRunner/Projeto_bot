server:
  port: 8080
  error:
    include-message: always
spring:
  application:
    name: media-monitor-dashboard
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://db:3306/media_monitor}
    username: ${SPRING_DATASOURCE_USERNAME:media}
    password: ${SPRING_DATASOURCE_PASSWORD:media}
    driver-class-name: org.mariadb.jdbc.Driver
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
dashboard:
  admin-user: ${DASHBOARD_USER:equipe}
  admin-password: ${DASHBOARD_PASSWORD:}
  owner-username: ${DASHBOARD_OWNER_USERNAME:}
  owner-email: ${DASHBOARD_OWNER_EMAIL:}
  session-days: 7
  public-url: ${DASHBOARD_PUBLIC_URL:http://localhost:4200}
  mail-from: ${REPORT_FROM:${SMTP_USER:}}
management:
  endpoints:
    web:
      exposure:
        include: health,info
