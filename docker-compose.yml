x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "3"

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: media_monitor
      MARIADB_USER: media
      MARIADB_PASSWORD: media
      MARIADB_ROOT_PASSWORD: change-me
    volumes: ["mariadb_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging
  api:
    image: cadu-python:latest
    build:
      context: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    volumes: ["./config:/app/config:ro"]
    logging: *default-logging
  worker:
    image: cadu-python:latest
    pull_policy: never
    command: ["python", "-m", "app.worker"]
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
    volumes: ["./config:/app/config:ro"]
    logging: *default-logging
  dashboard-web:
    build: ./dashboard-web
    ports: ["4200:80"]
    depends_on:
      - api
    restart: unless-stopped
    logging: *default-logging
volumes:
  mariadb_data:
