services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: media_monitor
      MARIADB_USER: media
      MARIADB_PASSWORD: media
      MARIADB_ROOT_PASSWORD: change-me
    volumes: ["mariadb_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    volumes: ["./config:/app/config:ro"]
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
    volumes: ["./config:/app/config:ro"]
  dashboard-api:
    build: ./dashboard-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/media_monitor
      SPRING_DATASOURCE_USERNAME: media
      SPRING_DATASOURCE_PASSWORD: media
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
  dashboard-web:
    build: ./dashboard-web
    environment:
      DASHBOARD_USER: ${DASHBOARD_USER:-equipe}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    ports: ["4200:80"]
    depends_on:
      - dashboard-api
      - api
    restart: unless-stopped
volumes:
  mariadb_data:
