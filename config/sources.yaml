rss:
  - nome: Agência Brasil
    url: https://agenciabrasil.ebc.com.br/rss/ultimasnoticias/feed.xml
    peso: 1.2
  - nome: G1
    url: https://g1.globo.com/rss/g1/
    peso: 1.1
  - nome: CNN Brasil
    url: https://www.cnnbrasil.com.br/feed/
    peso: 1.1
  - nome: Poder360
    url: https://www.poder360.com.br/feed/
    peso: 1.1
  - nome: Metrópoles
    url: https://www.metropoles.com/feed
    peso: 1.0
  - nome: Senado Notícias
    url: https://www12.senado.leg.br/noticias/feed/todasnoticias/RSS
    peso: 1.2

# Busca temática gratuita via RSS. Não usa GOOGLE_API_KEY.
google_news:
  enabled: true
  peso: 1.0
  horas: 72
  queries:
    - '"Instituto Carioca"'
    - '"esporte e lazer" (edital OR incentivo OR investimento OR "projeto social")'
    - 'corrupção OR "político corrupto" OR "políticos corruptos"'
    - '"emenda parlamentar" OR "emendas parlamentares"'
    - '(edital OR "chamamento público") (ONG OR esporte OR cultura OR "meio ambiente" OR "terceiro setor")'
    - '(empresa OR empresas) (investimento OR patrocínio) (ONG OR "meio ambiente" OR esporte)'
    - '"Lei Rouanet" OR "Lei Rounet" OR "lei de incentivo ao esporte"'
    - 'Maricá (prefeitura OR esporte OR lazer OR edital)'
  # Veículos nacionais acompanhados. As consultas por domínio complementam
  # os RSS diretos e continuam passando pelas palavras-chave de cada usuário.
  outlets:
    - {nome: Folha de S.Paulo, query: "site:folha.uol.com.br"}
    - {nome: O Globo, query: "site:oglobo.globo.com"}
    - {nome: O Estado de S. Paulo, query: "site:estadao.com.br"}
    - {nome: O Dia, query: "site:odia.ig.com.br"}
    - {nome: Extra, query: "site:extra.globo.com"}
    - {nome: Grupo Globo, query: "site:g1.globo.com OR site:globoplay.globo.com"}
    - {nome: GloboNews, query: "site:g1.globo.com/globonews"}
    - {nome: SporTV, query: "site:ge.globo.com OR site:sportv.globo.com"}
    - {nome: Record, query: "site:r7.com OR site:record.r7.com"}
    - {nome: SBT, query: "site:sbtnews.sbt.com.br"}
    - {nome: Band, query: "site:band.com.br OR site:band.uol.com.br"}
    - {nome: RedeTV!, query: "site:redetv.uol.com.br"}
    - {nome: TV Cultura, query: "site:tvcultura.com.br"}
    - {nome: Valor Econômico, query: "site:valor.globo.com"}
    - {nome: Correio Braziliense, query: "site:correiobraziliense.com.br"}
    - {nome: Zero Hora, query: "site:gauchazh.clicrbs.com.br"}
    - {nome: Veja, query: "site:veja.abril.com.br"}
    - {nome: Época Negócios, query: "site:epocanegocios.globo.com"}
    - {nome: Exame, query: "site:exame.com"}
    - {nome: CartaCapital, query: "site:cartacapital.com.br"}
    - {nome: UOL Notícias, query: "site:noticias.uol.com.br"}
    - {nome: R7, query: "site:r7.com"}
    - {nome: Terra, query: "site:terra.com.br/noticias"}
    - {nome: CBN, query: "site:cbn.globo.com"}
    - {nome: Jovem Pan News, query: "site:jovempan.com.br"}
    - {nome: BandNews FM, query: "site:band.com.br/radio/bandnews-fm"}
    - {nome: Rádio Itatiaia, query: "site:itatiaia.com.br"}
    - {nome: Rádio Gaúcha, query: "site:gauchazh.clicrbs.com.br"}
    - {nome: Rádio Nacional, query: "site:radios.ebc.com.br OR site:agenciabrasil.ebc.com.br"}

# Busca complementar pela Google Programmable Search API.
google:
  # Ative após liberar a Custom Search JSON API no projeto da chave.
  enabled: false
  queries:
    - '"Instituto Carioca"'
    - '"esporte e lazer" (edital OR incentivo OR investimento OR "projeto social")'
    - 'corrupção OR "político corrupto" OR "políticos corruptos"'
    - '"emenda parlamentar" OR "emendas parlamentares"'
    - '(edital OR "chamamento público") (ONG OR esporte OR cultura OR "meio ambiente" OR "terceiro setor")'
    - '(empresa OR empresas) (investimento OR patrocínio) (ONG OR "meio ambiente" OR esporte)'
    - '"Lei Rouanet" OR "Lei Rounet" OR "lei de incentivo ao esporte"'
    - 'Maricá (prefeitura OR esporte OR lazer OR edital)'

instagram:
  enabled: false
