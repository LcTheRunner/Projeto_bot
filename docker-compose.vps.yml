services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: media_monitor
      MARIADB_USER: media
      MARIADB_PASSWORD: media
      MARIADB_ROOT_PASSWORD: change-me
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8020:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - "./config:/app/config:ro"
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - "./config:/app/config:ro"
    restart: unless-stopped

  dashboard-api:
    build: ./dashboard-api
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/media_monitor
      SPRING_DATASOURCE_USERNAME: media
      SPRING_DATASOURCE_PASSWORD: media
      DASHBOARD_PUBLIC_URL: https://news.venturi.vps-kinghost.net
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  dashboard-web:
    build: ./dashboard-web
    expose:
      - "80"
    depends_on:
      - dashboard-api
      - api
    networks:
      - default
      - npm_proxy
    restart: unless-stopped

volumes:
  mariadb_data:

networks:
  npm_proxy:
    external: true
    name: nginx-proxy-manager_default
