x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "3"

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: media_monitor
      MARIADB_USER: media
      MARIADB_PASSWORD: media
      MARIADB_ROOT_PASSWORD: change-me
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *default-logging

  api:
    image: cadu-python:latest
    build:
      context: .
    env_file: .env
    ports:
      - "127.0.0.1:8020:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - "./config:/app/config:ro"
    restart: unless-stopped
    logging: *default-logging

  worker:
    image: cadu-python:latest
    pull_policy: never
    command: ["python", "-m", "app.worker"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - "./config:/app/config:ro"
    restart: unless-stopped
    logging: *default-logging

  dashboard-web:
    build: ./dashboard-web
    expose:
      - "80"
    depends_on:
      - api
    networks:
      - default
      - npm_proxy
    restart: unless-stopped
    logging: *default-logging

volumes:
  mariadb_data:

networks:
  npm_proxy:
    external: true
    name: nginx-proxy-manager_default
